name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please do **not** use this form for security vulnerabilities — see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, ideally starting from a clean clone.
      placeholder: |
        1. `pip install -r requirements.txt` / `pnpm install`
        2. Configure `models_config.json` with ...
        3. Run `run.bat` / `./run.sh`
        4. Do ...
        5. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste backend (uvicorn) and/or browser console output. This will be rendered as a code block, so no need for backticks.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Where does this happen?
      options:
        - Backend (FastAPI / core engine / memory-RAG)
        - Frontend (React SPA)
        - llama-server integration (inference/embeddings subprocess)
        - Database / migrations
        - CI / test suite
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js / pnpm version
      placeholder: e.g. Node 20, pnpm 9
    validations:
      required: false

  - type: textarea
    id: model
    attributes:
      label: Model / llama-server setup (if relevant)
      description: Model file/quant, `llama-server` build (stock llama.cpp vs. the turboquant-SYCL fork), and relevant flags from `models_config.json`.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this hasn't been reported already.
          required: true
        - label: This is not a security vulnerability (if it were, I'd use the private reporting channel in SECURITY.md instead).
          required: true
