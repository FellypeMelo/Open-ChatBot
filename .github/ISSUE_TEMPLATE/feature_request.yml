name: Feature request
description: Suggest an idea, enhancement, or new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is solo-maintained (see [CONTRIBUTING.md](../../CONTRIBUTING.md)). For anything beyond a small, self-contained change, opening an issue first — before a PR — helps make sure the direction fits before real work goes in.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Be as concrete as you can — UI behavior, API shape, config options, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, and why they're less good.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Where does this mostly touch?
      options:
        - Backend (FastAPI / core engine / memory-RAG)
        - Frontend (React SPA)
        - llama-server integration (inference/embeddings subprocess)
        - Database / migrations
        - CI / test suite
        - Documentation
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues/discussions and this hasn't been requested already.
          required: true
        - label: I understand this project runs entirely local-first (no hosted service, no bundled model) and I've framed the request accordingly.
          required: true
